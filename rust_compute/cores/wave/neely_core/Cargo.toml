[package]
name        = "neely_core"
version     = "0.1.0"
edition     = "2021"
description = "Neely Wave Core(P0;對齊 docs/archive/oldm2Spec/neely_core.md r2)— skeleton 階段"

[lib]
path = "src/lib.rs"

[dependencies]
fact_schema    = { path = "../../../cores_shared/fact_schema" }
core_registry  = { path = "../../../cores_shared/core_registry" }
anyhow         = { workspace = true }
chrono         = { workspace = true }
serde          = { workspace = true }
serde_json     = { workspace = true }
inventory      = "0.3"
# E1 assumption_hash(sha256 前 16 hex;blake3 保留給 params_hash 語意)
sha2           = "0.10"
# v4.32 Golden L3:TypeScript 契約 codegen(feature-gated → 生產 build 預設不開,零風險)
ts-rs          = { version = "10", features = ["chrono-impl"], optional = true }

[features]
# `cargo test --features ts` 從 output.rs 型別樹生 TS interface(drift 被抓 = 治本)。
# 生產 `cargo build --release -p tw_cores` 走預設 feature(不含 ts)→ 不引入 ts-rs。
# P1-1:OhlcvSeries 下放 fact_schema 後,ts feature 必須串 fact_schema/ts,
# 否則 codegen 缺 OhlcvSeries / OhlcvBar 型別(契約 diff 非空即此因)。
ts = ["dep:ts-rs", "fact_schema/ts"]
