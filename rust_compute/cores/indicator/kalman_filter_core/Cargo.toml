[package]
name        = "kalman_filter_core"
version     = "0.3.0"
edition     = "2021"
description = "Kalman Filter Core(P3,multi-horizon 1-D trend smoothing + 5-class regime,對齊 m3Spec/kalman_filter_core.md)"

[lib]
path = "src/lib.rs"

[dependencies]
fact_schema   = { path = "../../../cores_shared/fact_schema" }
ohlcv_loader  = { path = "../../../cores_shared/ohlcv_loader" }
core_registry = { path = "../../../cores_shared/core_registry" }
anyhow        = { workspace = true }
chrono        = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }
inventory     = "0.3"
# v4.32 Golden L3 #3:TypeScript 契約 codegen(feature-gated → 生產 build 預設不開)。
# 對齊 neely_core 既有 pattern:`cargo test --features ts -p kalman_filter_core` 生 TS。
ts-rs         = { version = "10", features = ["chrono-impl"], optional = true }

[features]
ts = ["dep:ts-rs"]
